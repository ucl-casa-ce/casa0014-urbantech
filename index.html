<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CASA0014 Urban Tech & Connected Environments Observatory</title>
  <meta name="description" content="Collaborative living observatory of urban sensors, IoT devices, and smart infrastructure across London documented by UCL CASA Connected Environments students.">
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
  <!-- Master Stylesheet -->
  <link rel="stylesheet" href="css/style.css?v=3">
</head>
<body>

  <!-- Site Navigation Header -->
  <header class="site-header">
    <div class="header-container">
      <div class="brand-wrapper">
        <span class="brand-badge">CASA0014</span>
        <a href="index.html" class="brand-title">
          Urban<span>Tech</span> Observatory
        </a>
      </div>
      <nav class="nav-actions">
        <a href="index.html" class="nav-link active">Explore Map</a>
        <a href="submit.html" class="btn-primary" id="header-submit-btn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
          Submit Observation
        </a>
      </nav>
    </div>
  </header>

  <!-- Hero & Controls Section -->
  <section class="hero-banner">
    <div class="hero-content">
      <div class="hero-headline">
        <h1>Sensing the City: Urban Tech Archive</h1>
        <p>A collaborative observatory documenting physical sensors, environmental monitors, and smart urban infrastructure across London — curated by UCL CASA students.</p>
      </div>

      <!-- Controls: Search, Filters & View Toggle -->
      <div class="controls-bar">
        <!-- Live Search -->
        <div class="search-box">
          <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
          <input type="text" id="search-input" class="search-input" placeholder="Search sensors, locations, pollutants, or students...">
        </div>

        <!-- Category Filter Pills -->
        <div class="filter-pills" id="category-filter-pills">
          <button class="filter-pill active" data-category="all">
            All Observations <span class="cat-count">(0)</span>
          </button>
          <button class="filter-pill" data-category="air-quality">
            Air Quality <span class="cat-count">(0)</span>
          </button>
          <button class="filter-pill" data-category="mobility">
            Mobility & People <span class="cat-count">(0)</span>
          </button>
          <button class="filter-pill" data-category="weather">
            Weather & Climate <span class="cat-count">(0)</span>
          </button>
          <button class="filter-pill" data-category="energy">
            Energy & Utilities <span class="cat-count">(0)</span>
          </button>
        </div>

        <!-- View Mode Switcher -->
        <div class="view-toggle" id="view-toggle-controls">
          <button class="toggle-btn active" id="view-split-btn" title="Map & Sidebar Split">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="12" y1="3" x2="12" y2="21"/></svg>
            Split
          </button>
          <button class="toggle-btn" id="view-map-btn" title="Full Map View">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"/><line x1="8" y1="2" x2="8" y2="18"/><line x1="16" y1="6" x2="16" y2="22"/></svg>
            Map
          </button>
          <button class="toggle-btn" id="view-grid-btn" title="Gallery Grid View">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
            Grid
          </button>
        </div>
      </div>
    </div>
  </section>

  <!-- Main View Container (Split Map + Cards) -->
  <main class="main-container view-split" id="main-view-container">
    <!-- Map Panel -->
    <div class="map-panel" id="map-panel-wrapper">
      <div id="map-container"></div>
    </div>

    <!-- Cards Stream / Grid -->
    <div class="cards-stream" id="cards-container">
      <!-- Dynamically populated by app.js -->
    </div>
  </main>

  <!-- Global Toast Notification -->
  <div id="global-toast" class="toast"></div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <!-- Main Application Script -->
  <script src="js/app.js?v=4"></script>
</body>
</html>
